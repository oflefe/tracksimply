name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calorie
          POSTGRES_PASSWORD: calorie
          POSTGRES_DB: calorie_tracker
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U calorie -d calorie_tracker"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://calorie:calorie@localhost:5432/calorie_tracker
      WEB_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.12.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @calorie-tracker/api prisma:generate
      - run: pnpm --filter @calorie-tracker/api prisma:migrate -- --skip-generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
