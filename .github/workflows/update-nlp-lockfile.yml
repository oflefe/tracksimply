name: Refresh NLP lockfile

on:
  push:
    branches:
      - agent/add-nlp-ingredient-extraction

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-nlp-ingredient-extraction
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @calorie-tracker/api exec vitest run src/parser/candidate-extractor.spec.ts src/parser/parser.spec.ts
      - name: Commit generated lockfile and remove this workflow
        run: |
          rm .github/workflows/update-nlp-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/update-nlp-lockfile.yml
          git commit -m "chore: refresh lockfile for NLP dependency"
          git push
