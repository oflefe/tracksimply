services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: calorie
      POSTGRES_PASSWORD: calorie
      POSTGRES_DB: calorie_tracker
    ports:
      - '5432:5432'
    volumes:
      - calorie-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U calorie -d calorie_tracker']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  calorie-postgres:
